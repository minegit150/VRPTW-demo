{% load static %}

<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>VRPTW Planner</title>
  <!-- Liên kết tới file CSS -->
  <link rel="stylesheet" href="{% static 'VRP1/css/styles_index.css' %}">
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <!-- Papa Parse & XLSX (đã phải thêm) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
  <h1>Thiết lập địa điểm kho hàng và danh sách đại lý</h1>
  <div class="container">
    <div class="form-container">
      <form id="vrptw-form">
        {% csrf_token %}
        
        <!-- Kho hàng -->
        <label for="depot">Địa điểm kho hàng:</label>
        <input type="text" id="depot" name="depot" placeholder="Nhấp vào đây rồi chọn trên map" required readonly>
        
        <!-- Upload danh sách đại lý và đơn hàng -->
        <label for="agentFile">Tải lên danh sách đại lý (CSV hoặc XLSX):</label>
        <input type="file" id="agentFile" name="agentFile"
               accept=".csv,.xlsx" required>
 
        <button type="submit">Tính toán</button>
      </form>
    </div>
    
    <div class="map-container">
      <div id="map"></div>
    </div>
  </div>
  
  <script>
    // Khởi tạo bản đồ (đặt trung tâm tại Hà Nội)
    var map = L.map('map').setView([21.0278, 105.8342], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);
    
    // Khai báo icon cho kho hàng (đỏ) 
    var redIcon = L.icon({
      iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.png',
      shadowUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-shadow.png',
      iconSize:     [25, 41],      iconAnchor:   [12, 41],
      popupAnchor:  [1, -34],      shadowSize:   [41, 41]
    });
    
    var selectedMode = null; 
    var depotMarker = null;
    
    document.getElementById("depot").addEventListener("focus", function() {
      selectedMode = "depot";
    });
    
    map.on('click', function(e) {
      var latlng = e.latlng;
      if (selectedMode === "depot") {
        if (!depotMarker) {
          depotMarker = L.marker(latlng, {icon: redIcon, draggable: true}).addTo(map);
          depotMarker.bindPopup("Depot<br>(Right-click để xoá)").openPopup();
        } else {
          depotMarker.setLatLng(latlng);
        }
        document.getElementById('depot').value = latlng.lat.toFixed(6) + ", " + latlng.lng.toFixed(6);
    
        depotMarker.on('dragend', function(event) {
          var pos = event.target.getLatLng();
          document.getElementById('depot').value = pos.lat.toFixed(6) + ", " + pos.lng.toFixed(6);
          depotMarker.bindPopup("Depot<br>(Right-click để xoá)");
        });
    
        depotMarker.on('contextmenu', function(e) {
          map.removeLayer(depotMarker);
          depotMarker = null;
          document.getElementById('depot').value = "";
        });
      }
      else {
        alert("Vui lòng nhấn vào ô 'Địa điểm kho hàng' trước khi chọn tọa độ trên map.");
      }
    });
    
    // Hàm parse CSV / XLSX
    function handleParsed(dataArray) {
      // Lấy depot hiện có
      const depotData = JSON.parse(localStorage.getItem('vrptw_coords') || '{}');
      const depotCoords = depotData.depot;
      // Tạo mảng agents duy nhất
      const uniqueAgents = [];
      const seen = new Set();
      dataArray.forEach(item => {
        const coordStr = item['Điểm giao hàng'];
        if (!seen.has(coordStr)) {
          seen.add(coordStr);
          const [lat, lng] = coordStr.split(',').map(Number);
          uniqueAgents.push([lat, lng]);
        }
      });
      // Lưu vào localStorage
      localStorage.setItem('data_demo', JSON.stringify(dataArray));
      localStorage.setItem('vrptw_coords', JSON.stringify({ depot: depotCoords, agents: uniqueAgents }));
      window.location.href = 'result';
    }

    function parseCSV(file) {
      Papa.parse(file, {
        header: true, skipEmptyLines: true,
        complete: (res) => handleParsed(res.data),
        error: (err) => alert('Lỗi đọc CSV: ' + err.message)
      });
    }
    function parseXLSX(file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        // 1) Đọc Workbook với cellDates để giữ cell định dạng date/time
        const data = new Uint8Array(e.target.result);
        const wb = XLSX.read(data, {
          type: 'array',
          cellDates: true        // parse các ô date/time thành JS Date
        });
        const sheet = wb.Sheets[wb.SheetNames[0]];
    
        // 2) Xuất JSON, ép raw=false và dateNF để format lại time
        const json = XLSX.utils.sheet_to_json(sheet, {
          defval: '',
          raw: false,            // sử dụng formatter thay vì trả về số serial
          dateNF: 'h:mm AM/PM'   // format giống file Excel gốc
        });
        handleParsed(json);
      };
      reader.readAsArrayBuffer(file);
    }
    
    document.getElementById("vrptw-form")
      .addEventListener("submit", function(e) {
        e.preventDefault();
        if (!depotMarker) {
          alert("Vui lòng chọn kho hàng trên map.");
          return;
        }
        // Lưu depot tạm thời
        const depotValue = document.getElementById("depot").value;
        const depotCoords = depotValue.split(',').map(Number);
        localStorage.setItem('vrptw_coords',
          JSON.stringify({ depot: depotCoords }));
        // Đọc file
        const file = document.getElementById('agentFile').files[0];
        const ext = file.name.split('.').pop().toLowerCase();
        if (ext === 'csv') parseCSV(file);
        else if (ext === 'xlsx') parseXLSX(file);
        else alert('Chỉ chấp nhận file CSV hoặc XLSX');
      });
  </script>
</body>
</html>
